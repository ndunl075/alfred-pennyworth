name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, stated rather than inherited. The repository default is
# already read-only, but a default is a setting someone can change later,
# and this workflow runs code from any pull request -- it should never be
# one toggle away from a writable token.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install alfred-core
        run: python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest -q
